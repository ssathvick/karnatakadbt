<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Farmer registry · KarnatakaDBT</title><link rel="stylesheet" href="/farmers/style.css"><script defer src="/farmers/app.js"></script><main><h1>Farmer registry</h1><p>Dedicated farmer records and administrative geography.</p><p id="status" role="status">Checking staff access…</p><section id="workspace" hidden><button id="refresh">Refresh</button><table><thead><tr><th>Farmer ID</th><th>Name</th><th>Revision</th><th>Open</th></tr></thead><tbody id="rows"></tbody></table><nav><button id="previous">Previous</button><span id="page"></span><button id="next">Next</button></nav><details id="editor"><summary>Create or edit farmer</summary><form id="record"><label>Farmer ID<input name="farmer_id" required maxlength="256"></label><label>Name<input name="name" required maxlength="256"></label><label>Registration date<input name="registration_date" type="date" required></label><label>Explicit linked registry ID (optional)<input name="link_registry_id"></label><label>Land area (hectares)<input name="land_area" type="number" min="0" step="any" value="0" required></label><label>Cattle count<input name="no_of_cattle_heads" type="number" min="0" step="1" value="0" required></label><label>Poultry count<input name="no_of_poultry_heads" type="number" min="0" step="1" value="0" required></label><label>Large administrative area ID<input name="large_area_id" required></label><label>Large administrative area code<input name="large_area_code" required></label><label>Small administrative area ID<input name="small_area_id" required></label><label>Small administrative area code<input name="small_area_code" required></label><button id="save">Save farmer</button><button type="button" id="new">New record</button></form></details><h2>Revision history</h2><pre id="history">Select a farmer to view revisions.</pre></section></main></html>
